[project]
name = "cs361-backend"
version = "0.1.0"
description = "CS361 Faculty Output API: lecturer profiles, publications, research interests and expertise."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # >=0.121 for Depends(..., scope="function") used by the DB session dependency
    "fastapi[standard]>=0.121",
    "sqlmodel>=0.0.24",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    # Starlette's TestClient prefers httpx2 (falls back to httpx with a deprecation warning)
    "httpx2>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
# Legacy V2 Lambda code (backend/v2/) has its own conventions. Anchored path on purpose:
# a bare "v2" would also exclude app/v2 and tests/v2.
extend-exclude = ["v2/query"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "FAST"]
