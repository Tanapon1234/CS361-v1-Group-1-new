name: Bug Report
description: แจ้งปัญหาที่เจอในโปรเจกต์
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: อธิบายปัญหา
      description: ปัญหาคืออะไร
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: ขั้นตอนที่ทำให้เกิดปัญหา
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: ความรุนแรง
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
