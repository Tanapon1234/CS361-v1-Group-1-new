<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .panel { fill: #ffffff; stroke: #d8dee9; stroke-width: 1.2; }
      .soft { fill: #f2f6fb; stroke: #d8dee9; stroke-width: 1; }
      .db { fill: #eef7f1; stroke: #9bd3ad; stroke-width: 1.2; }
      .api { fill: #eef4ff; stroke: #9bbcf2; stroke-width: 1.2; }
      .audit { fill: #fff7ed; stroke: #f5b56b; stroke-width: 1.2; }
      .title { font: 700 34px "Noto Sans Thai", Tahoma, Arial, sans-serif; fill: #10203d; }
      .h2 { font: 700 22px "Noto Sans Thai", Tahoma, Arial, sans-serif; fill: #10203d; }
      .label { font: 600 15px "Noto Sans Thai", Tahoma, Arial, sans-serif; fill: #20314f; }
      .value { font: 14px "Noto Sans Thai", Tahoma, Arial, sans-serif; fill: #52637a; }
      .tiny { font: 12px "Noto Sans Thai", Tahoma, Arial, sans-serif; fill: #6b7b91; }
      .mono { font: 13px "SFMono-Regular", Consolas, monospace; fill: #24324a; }
      .monoSmall { font: 12px "SFMono-Regular", Consolas, monospace; fill: #3c4960; }
      .arrow { stroke: #7b8797; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #d8dee9; stroke-width: 1; }
      .badge { fill: #155bd5; }
      .badgeText { font: 700 13px "Noto Sans Thai", Tahoma, Arial, sans-serif; fill: #ffffff; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7b8797"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1120"/>
  <text x="60" y="70" class="title">ภาพรวม Payload → Database ของการ์ด #70</text>
  <text x="60" y="104" class="value">สิ่งที่หน้า Admin ส่งเข้า `POST /api/v2/admin/work-items` และ backend ต้องแยกไปเก็บหลายตารางใน Aurora transaction เดียว</text>

  <!-- Request payload -->
  <rect class="api" x="60" y="145" rx="10" ry="10" width="470" height="895"/>
  <rect class="badge" x="88" y="175" rx="5" ry="5" width="116" height="28"/>
  <text x="108" y="194" class="badgeText">REQUEST</text>
  <text x="88" y="235" class="h2">JSON Payload จาก Admin UI</text>
  <text x="88" y="278" class="mono">{</text>
  <text x="112" y="305" class="monoSmall">"id": "wi-admin-demo-2567-cs333-lecture",</text>
  <text x="112" y="330" class="monoSmall">"title": "CS333 Software Engineering Lecture",</text>
  <text x="112" y="355" class="monoSmall">"description": "Lecture workload...",</text>
  <text x="112" y="380" class="monoSmall">"category_code": "TEACHING",</text>
  <text x="112" y="405" class="monoSmall">"work_type_code": "LECTURE",</text>
  <text x="112" y="430" class="monoSmall">"visibility": "INTERNAL",</text>
  <text x="112" y="455" class="monoSmall">"start_date": "2025-01-13",</text>
  <text x="112" y="480" class="monoSmall">"end_date": "2025-05-09",</text>
  <text x="112" y="525" class="monoSmall">"faculty": [{</text>
  <text x="136" y="550" class="monoSmall">"faculty_id": "fac_prapaporn-...",</text>
  <text x="136" y="575" class="monoSmall">"academic_period_id": "ap-2567-2",</text>
  <text x="136" y="600" class="monoSmall">"evaluation_period_id": "eval-2567-full-year",</text>
  <text x="136" y="625" class="monoSmall">"role": "INSTRUCTOR",</text>
  <text x="136" y="650" class="monoSmall">"contribution_percent": 100,</text>
  <text x="136" y="675" class="monoSmall">"quantity": 1, "credits": 3, "hours": 45</text>
  <text x="112" y="700" class="monoSmall">}],</text>
  <text x="112" y="745" class="monoSmall">"detail": { "kind": "teaching", ... },</text>
  <text x="112" y="790" class="monoSmall">"evidence": [{</text>
  <text x="136" y="815" class="monoSmall">"label": "Course syllabus",</text>
  <text x="136" y="840" class="monoSmall">"reference_type": "URL",</text>
  <text x="136" y="865" class="monoSmall">"external_url": "https://...",</text>
  <text x="136" y="890" class="monoSmall">"mime_type": "text/html",</text>
  <text x="136" y="915" class="monoSmall">"visibility": "INTERNAL"</text>
  <text x="112" y="940" class="monoSmall">}]</text>
  <text x="88" y="965" class="mono">}</text>
  <text x="88" y="1012" class="tiny">หมายเหตุ: client ห้ามส่ง created_by, updated_by, status, deleted_at, audit actor</text>

  <!-- Middle transaction -->
  <rect class="panel" x="640" y="145" rx="10" ry="10" width="455" height="895"/>
  <rect class="badge" x="668" y="175" rx="5" ry="5" width="144" height="28"/>
  <text x="690" y="194" class="badgeText">BACKEND</text>
  <text x="668" y="235" class="h2">Admin Lambda ทำอะไร</text>

  <rect class="soft" x="668" y="270" rx="8" ry="8" width="395" height="78"/>
  <text x="690" y="302" class="label">1. ตรวจสิทธิ์ ADMIN</text>
  <text x="690" y="327" class="tiny">ใช้ Cognito/Admin auth จาก #69</text>

  <rect class="soft" x="668" y="374" rx="8" ry="8" width="395" height="92"/>
  <text x="690" y="406" class="label">2. Validate master data</text>
  <text x="690" y="431" class="tiny">category/type/faculty/period/visibility ต้องมีจริง</text>
  <text x="690" y="452" class="tiny">เช่น TEACHING ต้องคู่กับ LECTURE ไม่ใช่ TEACHING_LECTURE</text>

  <rect class="soft" x="668" y="492" rx="8" ry="8" width="395" height="104"/>
  <text x="690" y="524" class="label">3. BeginTransaction</text>
  <text x="690" y="549" class="tiny">เปิด transaction ผ่าน RDS Data API</text>
  <text x="690" y="570" class="tiny">ถ้า step ใด fail ต้อง Rollback</text>

  <rect class="soft" x="668" y="622" rx="8" ry="8" width="395" height="132"/>
  <text x="690" y="654" class="label">4. Insert หลายตาราง</text>
  <text x="690" y="679" class="tiny">work_item → faculty_work_item → detail</text>
  <text x="690" y="700" class="tiny">→ evidence_reference → audit_event</text>
  <text x="690" y="721" class="tiny">ทั้งหมดต้องสำเร็จพร้อมกัน</text>

  <rect class="soft" x="668" y="780" rx="8" ry="8" width="395" height="92"/>
  <text x="690" y="812" class="label">5. Commit และ return response</text>
  <text x="690" y="837" class="tiny">คืน id/status/links ให้ frontend</text>

  <rect class="audit" x="668" y="910" rx="8" ry="8" width="395" height="78"/>
  <text x="690" y="942" class="label">Audit</text>
  <text x="690" y="967" class="tiny">บันทึกว่า admin คนไหนสร้าง record นี้</text>

  <!-- DB tables -->
  <rect class="db" x="1210" y="145" rx="10" ry="10" width="530" height="895"/>
  <rect class="badge" x="1238" y="175" rx="5" ry="5" width="116" height="28"/>
  <text x="1265" y="194" class="badgeText">AURORA</text>
  <text x="1238" y="235" class="h2">ตารางที่ถูกสร้างข้อมูล</text>

  <rect class="panel" x="1238" y="270" rx="8" ry="8" width="450" height="92"/>
  <text x="1260" y="302" class="label">work_item</text>
  <text x="1260" y="327" class="tiny">รายการหลัก: title, category_code, work_type_code, visibility, dates</text>

  <rect class="panel" x="1238" y="388" rx="8" ry="8" width="450" height="92"/>
  <text x="1260" y="420" class="label">faculty_work_item</text>
  <text x="1260" y="445" class="tiny">ผูกกับอาจารย์ ปีการศึกษา รอบประเมิน บทบาท หน่วยกิต ชั่วโมง</text>

  <rect class="panel" x="1238" y="506" rx="8" ry="8" width="450" height="112"/>
  <text x="1260" y="538" class="label">teaching_detail</text>
  <text x="1260" y="563" class="tiny">เพราะ detail.kind = teaching</text>
  <text x="1260" y="586" class="tiny">เก็บ course_code, course_title, teaching_mode, student_count</text>

  <rect class="panel" x="1238" y="644" rx="8" ry="8" width="450" height="92"/>
  <text x="1260" y="676" class="label">evidence_reference</text>
  <text x="1260" y="701" class="tiny">เก็บ metadata ของหลักฐาน เช่น label, URL, mime_type, visibility</text>

  <rect class="panel" x="1238" y="762" rx="8" ry="8" width="450" height="92"/>
  <text x="1260" y="794" class="label">audit_event</text>
  <text x="1260" y="819" class="tiny">เก็บ action = WORK_ITEM_CREATE และ actor จาก admin token</text>

  <rect class="soft" x="1238" y="900" rx="8" ry="8" width="450" height="88"/>
  <text x="1260" y="932" class="label">ผลลัพธ์ที่เอาไปใช้ต่อ</text>
  <text x="1260" y="957" class="tiny">ถ้า visibility = PUBLIC จะอ่านกลับผ่าน #68 ได้</text>
  <text x="1260" y="978" class="tiny">ถ้า INTERNAL/RESTRICTED จะใช้ใน admin เท่านั้น</text>

  <!-- arrows -->
  <path class="arrow" d="M 535 585 C 575 585, 595 585, 632 585"/>
  <path class="arrow" d="M 1095 585 C 1140 585, 1165 585, 1202 585"/>
</svg>
