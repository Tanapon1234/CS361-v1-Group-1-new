<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#111827"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#dc2626"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
      .title { font-size: 26px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #4b5563; }
      .section-title { font-size: 17px; font-weight: 700; }
      .box-title { font-size: 16px; font-weight: 700; }
      .box-text { font-size: 13px; fill: #374151; }
      .tiny { font-size: 11px; fill: #4b5563; }
      .actor { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .vercel { fill: #f9fafb; stroke: #111827; stroke-width: 2; }
      .aws { fill: #f8fafc; stroke: #475569; stroke-width: 2; }
      .service { fill: #ffffff; stroke: #334155; stroke-width: 1.8; }
      .api { fill: #fdf2f8; stroke: #db2777; stroke-width: 2; }
      .lambda { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .dataapi { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .db { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
      .s3 { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .security { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; }
      .monitor { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
      .optional { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .arrow { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow-blue { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrow-blue); }
      .arrow-red { stroke: #dc2626; stroke-width: 2; fill: none; marker-end: url(#arrow-red); }
      .dash { stroke: #64748b; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .no-arrow { stroke: #64748b; stroke-width: 1.6; fill: none; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect width="1500" height="960" fill="#ffffff"/>
  <text x="750" y="36" text-anchor="middle" class="title">V2 Faculty Output Repository Architecture</text>
  <text x="750" y="60" text-anchor="middle" class="subtitle">Managed multi-year repository with public read APIs, admin pilot, controlled import, projection, security, and observability</text>

  <!-- External actors -->
  <rect x="35" y="118" width="150" height="92" rx="12" class="actor"/>
  <text x="110" y="150" text-anchor="middle" class="box-title">Public User</text>
  <text x="110" y="174" text-anchor="middle" class="box-text">นักศึกษา / ผู้ใช้ทั่วไป</text>
  <text x="110" y="194" text-anchor="middle" class="tiny">No login</text>

  <rect x="35" y="265" width="150" height="92" rx="12" class="actor"/>
  <text x="110" y="298" text-anchor="middle" class="box-title">Admin</text>
  <text x="110" y="322" text-anchor="middle" class="box-text">Repository pilot</text>
  <text x="110" y="342" text-anchor="middle" class="tiny">Login required</text>

  <rect x="35" y="735" width="150" height="92" rx="12" class="actor"/>
  <text x="110" y="768" text-anchor="middle" class="box-title">Project Team</text>
  <text x="110" y="792" text-anchor="middle" class="box-text">Approved source files</text>
  <text x="110" y="812" text-anchor="middle" class="tiny">CSV / JSON / XLSX</text>

  <!-- Vercel zone -->
  <rect x="235" y="105" width="220" height="265" rx="4" class="vercel"/>
  <text x="345" y="135" text-anchor="middle" class="section-title">Frontend Hosting</text>
  <text x="345" y="158" text-anchor="middle" class="box-title">Vercel</text>
  <rect x="265" y="188" width="160" height="58" rx="8" class="service"/>
  <text x="345" y="212" text-anchor="middle" class="box-title">Next.js Public UI</text>
  <text x="345" y="233" text-anchor="middle" class="tiny">/faculties, /outputs</text>
  <rect x="265" y="278" width="160" height="58" rx="8" class="service"/>
  <text x="345" y="302" text-anchor="middle" class="box-title">Next.js Admin UI</text>
  <text x="345" y="323" text-anchor="middle" class="tiny">/admin/*</text>

  <!-- AWS cloud -->
  <rect x="500" y="90" width="955" height="800" rx="4" class="aws"/>
  <text x="520" y="118" class="section-title">AWS Cloud</text>
  <text x="600" y="118" class="tiny">ap-southeast-1 target region</text>

  <!-- API Gateway and auth -->
  <rect x="555" y="160" width="170" height="92" rx="8" class="api"/>
  <text x="640" y="190" text-anchor="middle" class="box-title">API Gateway</text>
  <text x="640" y="212" text-anchor="middle" class="box-text">HTTP API</text>
  <text x="640" y="234" text-anchor="middle" class="tiny">/api/v1, /api/v2</text>

  <rect x="555" y="298" width="170" height="88" rx="8" class="security"/>
  <text x="640" y="328" text-anchor="middle" class="box-title">Cognito</text>
  <text x="640" y="350" text-anchor="middle" class="box-text">Admin User Pool</text>
  <text x="640" y="370" text-anchor="middle" class="tiny">JWT Authorizer</text>

  <!-- Lambdas -->
  <rect x="785" y="132" width="190" height="82" rx="8" class="lambda"/>
  <text x="880" y="162" text-anchor="middle" class="box-title">Query Lambda</text>
  <text x="880" y="184" text-anchor="middle" class="box-text">Public / repository read</text>
  <text x="880" y="202" text-anchor="middle" class="tiny">Search, filter, detail</text>

  <rect x="785" y="244" width="190" height="82" rx="8" class="lambda"/>
  <text x="880" y="274" text-anchor="middle" class="box-title">Admin Lambda</text>
  <text x="880" y="296" text-anchor="middle" class="box-text">Create / edit / soft delete</text>
  <text x="880" y="314" text-anchor="middle" class="tiny">Transactions + audit</text>

  <rect x="785" y="590" width="190" height="82" rx="8" class="lambda"/>
  <text x="880" y="620" text-anchor="middle" class="box-title">Import Lambda</text>
  <text x="880" y="642" text-anchor="middle" class="box-text">Validate / normalize</text>
  <text x="880" y="660" text-anchor="middle" class="tiny">Idempotent import</text>

  <rect x="785" y="725" width="190" height="82" rx="8" class="lambda"/>
  <text x="880" y="755" text-anchor="middle" class="box-title">Projection Lambda</text>
  <text x="880" y="777" text-anchor="middle" class="box-text">Public-safe export</text>
  <text x="880" y="795" text-anchor="middle" class="tiny">Preserve V1 contract</text>

  <!-- Data plane -->
  <rect x="1045" y="210" width="175" height="90" rx="8" class="dataapi"/>
  <text x="1132" y="242" text-anchor="middle" class="box-title">RDS Data API</text>
  <text x="1132" y="265" text-anchor="middle" class="box-text">SQL over AWS SDK</text>
  <text x="1132" y="284" text-anchor="middle" class="tiny">No persistent DB conn</text>

  <rect x="1265" y="205" width="150" height="100" rx="8" class="db"/>
  <text x="1340" y="238" text-anchor="middle" class="box-title">Aurora</text>
  <text x="1340" y="260" text-anchor="middle" class="box-text">PostgreSQL</text>
  <text x="1340" y="280" text-anchor="middle" class="tiny">Serverless v2</text>
  <text x="1340" y="298" text-anchor="middle" class="tiny">V2 repository</text>

  <rect x="1045" y="360" width="175" height="90" rx="8" class="security"/>
  <text x="1132" y="392" text-anchor="middle" class="box-title">Secrets Manager</text>
  <text x="1132" y="415" text-anchor="middle" class="box-text">DB secret</text>
  <text x="1132" y="434" text-anchor="middle" class="tiny">No secrets in frontend</text>

  <!-- S3 -->
  <rect x="555" y="590" width="170" height="240" rx="8" class="s3"/>
  <text x="640" y="620" text-anchor="middle" class="box-title">Amazon S3</text>
  <text x="640" y="642" text-anchor="middle" class="box-text">Private bucket</text>
  <text x="640" y="664" text-anchor="middle" class="tiny">Block Public Access</text>
  <text x="585" y="696" class="tiny">landing/</text>
  <text x="585" y="718" class="tiny">archive/</text>
  <text x="585" y="740" class="tiny">evidence/</text>
  <text x="585" y="762" class="tiny">metadata/</text>
  <text x="585" y="784" class="tiny">exports/</text>
  <text x="585" y="806" class="tiny">public-serving/</text>

  <!-- IAM and CloudWatch -->
  <rect x="1045" y="520" width="175" height="105" rx="8" class="security"/>
  <text x="1132" y="552" text-anchor="middle" class="box-title">IAM</text>
  <text x="1132" y="575" text-anchor="middle" class="box-text">Least privilege</text>
  <text x="1132" y="594" text-anchor="middle" class="tiny">Query / Admin / Import</text>
  <text x="1132" y="612" text-anchor="middle" class="tiny">Projection roles</text>

  <rect x="1265" y="520" width="150" height="105" rx="8" class="monitor"/>
  <text x="1340" y="552" text-anchor="middle" class="box-title">CloudWatch</text>
  <text x="1340" y="575" text-anchor="middle" class="box-text">Logs / metrics</text>
  <text x="1340" y="594" text-anchor="middle" class="tiny">API 5xx, Lambda errors</text>
  <text x="1340" y="612" text-anchor="middle" class="tiny">DB latency / import</text>

  <!-- Optional cache -->
  <rect x="555" y="455" width="170" height="76" rx="8" class="optional"/>
  <text x="640" y="484" text-anchor="middle" class="box-title">CloudFront</text>
  <text x="640" y="506" text-anchor="middle" class="box-text">Optional / deferred</text>
  <text x="640" y="523" text-anchor="middle" class="tiny">Public GET only if needed</text>

  <!-- Legacy V1 box -->
  <rect x="1045" y="725" width="370" height="105" rx="8" class="service"/>
  <text x="1230" y="755" text-anchor="middle" class="box-title">V1 Compatibility Surface</text>
  <text x="1230" y="780" text-anchor="middle" class="box-text">/faculties and /faculties/{id} must keep working</text>
  <text x="1230" y="802" text-anchor="middle" class="tiny">Projection can generate public-serving JSON while preserving old slugs</text>

  <!-- Flow arrows external -->
  <path d="M185 164 L265 215" class="arrow"/>
  <path d="M185 311 L265 307" class="arrow"/>
  <path d="M425 217 L555 206" class="arrow"/>
  <path d="M425 307 L555 342" class="arrow-red"/>
  <path d="M185 781 L555 700" class="arrow"/>

  <!-- API/auth flow -->
  <path d="M725 206 L785 173" class="arrow"/>
  <path d="M725 206 C750 210 755 284 785 285" class="arrow"/>
  <path d="M640 298 L640 252" class="arrow-red"/>
  <text x="678" y="280" class="tiny" fill="#dc2626">JWT protects /admin/*</text>

  <!-- Lambda to data API -->
  <path d="M975 173 C1010 175 1018 241 1045 250" class="arrow-blue"/>
  <path d="M975 285 L1045 255" class="arrow-blue"/>
  <path d="M975 631 C1015 620 1015 280 1045 260" class="arrow-blue"/>
  <path d="M975 766 C1022 740 1015 287 1045 267" class="arrow-blue"/>
  <path d="M1220 255 L1265 255" class="arrow-blue"/>

  <!-- Secrets -->
  <path d="M1132 360 L1132 300" class="dash"/>
  <text x="1148" y="335" class="tiny">DB credentials</text>

  <!-- S3 flows -->
  <path d="M725 700 L785 631" class="arrow"/>
  <path d="M785 631 L725 720" class="arrow"/>
  <path d="M785 766 L725 806" class="arrow"/>
  <path d="M975 776 L1045 776" class="arrow"/>

  <!-- IAM control lines -->
  <path d="M1132 520 C1095 485 1008 430 880 214" class="no-arrow"/>
  <path d="M1132 520 C1090 500 1000 445 880 326" class="no-arrow"/>
  <path d="M1132 625 C1080 680 1005 700 880 672" class="no-arrow"/>
  <text x="987" y="505" class="tiny">permission boundary</text>

  <!-- CloudWatch log lines -->
  <path d="M975 155 C1125 125 1255 300 1340 520" class="no-arrow"/>
  <path d="M975 285 C1120 285 1260 380 1340 520" class="no-arrow"/>
  <path d="M975 631 C1110 640 1245 625 1265 585" class="no-arrow"/>

  <!-- Labels -->
  <rect x="235" y="405" width="220" height="70" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="345" y="432" text-anchor="middle" class="box-title">No Direct Data Access</text>
  <text x="345" y="454" text-anchor="middle" class="box-text">Users and frontend never access</text>
  <text x="345" y="471" text-anchor="middle" class="box-text">Aurora, S3, or secrets directly</text>

  <path d="M345 370 L345 405" class="arrow-red"/>

  <rect x="520" y="852" width="895" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="968" y="873" text-anchor="middle" class="tiny">
    Core rule: V2 repository runs on Aurora PostgreSQL; S3 stores source/evidence/archive/projection; Cognito protects Admin only; IAM and CloudWatch enforce security and observability.
  </text>
</svg>
